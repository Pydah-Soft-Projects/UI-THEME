name: Deploy Theme System to Production (ui-theme.pydah.edu.in)

on:
  push:
    branches:
      - main

concurrency:
  group: production-theme-system
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to AWS Lightsail
    runs-on: ubuntu-latest

    steps:
      #################################################
      # 1. Checkout repository
      #################################################
      - name: Checkout Repository
        uses: actions/checkout@v4

      #################################################
      # 2. Setup Node.js for frontend build
      #################################################
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      #################################################
      # 3. Build Theme Editor frontend on GitHub Actions
      #################################################
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build

      #################################################
      # 4. Configure SSH
      #################################################
      - name: Configure SSH
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_IP }}" >> ~/.ssh/known_hosts

      #################################################
      # 5. Upload frontend build to server
      #################################################
      - name: Upload frontend build
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key" \
            frontend/dist/ \
            "ec2-user@${{ secrets.SERVER_IP }}:/tmp/theme-editor-dist/"

      #################################################
      # 6. Deploy on Lightsail Server
      #################################################
      - name: Deploy to server
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          set -e
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "ec2-user@${SERVER_IP}" << 'ENDSSH'

          set -e

          PROJECT_DIR="/home/ec2-user/UI-THEME"
          FRONTEND_WEB_ROOT="/var/www/themes/frontend"
          RUNTIME_DATA_DIR="/var/lib/ui-theme"

          echo "=========================================="
          echo "Starting Theme System Deployment"
          echo "Domain: ui-theme.pydah.edu.in"
          echo "=========================================="

          #################################################
          # 1. RUNTIME DATA DIRECTORY SETUP (/var/lib/ui-theme)
          #################################################
          echo "==> Ensuring runtime data directory exists..."
          sudo mkdir -p "${RUNTIME_DATA_DIR}/themes/history" "${RUNTIME_DATA_DIR}/public/themes" "${RUNTIME_DATA_DIR}/backups"
          sudo chown -R ec2-user:ec2-user "${RUNTIME_DATA_DIR}"

          # Migrate existing live theme if data dir is fresh
          if [ ! -f "${RUNTIME_DATA_DIR}/themes/active-theme.json" ] && [ -f "${PROJECT_DIR}/themes/active-theme.json" ]; then
            echo "==> Migrating existing live theme to runtime data directory..."
            cp -r "${PROJECT_DIR}/themes/"* "${RUNTIME_DATA_DIR}/themes/" 2>/dev/null || true
            cp -r "${PROJECT_DIR}/public/"* "${RUNTIME_DATA_DIR}/public/" 2>/dev/null || true
          fi

          #################################################
          # 2. APPLICATION CODE SYNC (Zero-Conflict)
          #################################################
          cd "${PROJECT_DIR}"
          echo "==> Syncing application code cleanly from origin/main..."
          # Discard local modifications to tracked files so checkout/reset never blocks
          git reset --hard HEAD 2>/dev/null || true
          git fetch origin main
          git checkout -f main 2>/dev/null || git checkout -B main origin/main
          git reset --hard origin/main
          git clean -fd

          #################################################
          # 3. BACKEND DEPENDENCIES & COMPILATION
          #################################################
          echo "==> Checking backend dependencies..."
          LOCK_HASH_FILE="${PROJECT_DIR}/.npm-ci-lockhash"
          CURRENT_HASH="$(sha256sum package-lock.json package.json 2>/dev/null | sha256sum | awk '{print $1}')"
          PREV_HASH="$(cat "${LOCK_HASH_FILE}" 2>/dev/null || true)"

          if [ ! -d node_modules ] || [ "${CURRENT_HASH}" != "${PREV_HASH}" ]; then
            echo "==> Installing backend dependencies..."
            if [ -f package-lock.json ]; then
              npm ci --omit=dev
            else
              npm install --omit=dev
            fi
            echo "${CURRENT_HASH}" > "${LOCK_HASH_FILE}"
          else
            echo "==> Backend dependencies unchanged, skipping npm install"
          fi

          # Ensure runtime CSS is compiled in the data directory
          THEME_DATA_DIR="${RUNTIME_DATA_DIR}" node scripts/generate-css.js

          #################################################
          # 4. DEPLOY FRONTEND SPA FOR NGINX
          #################################################
          echo "==> Deploying Theme Editor frontend..."
          sudo mkdir -p "${FRONTEND_WEB_ROOT}"

          sudo rsync -av --delete \
            /tmp/theme-editor-dist/ \
            "${FRONTEND_WEB_ROOT}/"

          # Guarantee static themes are also available directly in frontend web root
          # This ensures Nginx serves /themes/* with 200 OK regardless of which root Nginx is currently using
          sudo mkdir -p "${FRONTEND_WEB_ROOT}/themes"
          sudo cp -rf "${RUNTIME_DATA_DIR}/public/themes/"* "${FRONTEND_WEB_ROOT}/themes/" 2>/dev/null || true
          sudo cp -rf "${RUNTIME_DATA_DIR}/public/"* "${FRONTEND_WEB_ROOT}/" 2>/dev/null || true

          # Ensure Nginx read permissions across web roots and runtime data
          sudo chmod -R 755 "${FRONTEND_WEB_ROOT}" "${RUNTIME_DATA_DIR}"

          #################################################
          # 5. PM2 (BACKEND PROCESS ON PORT 7000)
          #################################################
          echo "==> Reloading PM2 process via ecosystem.config.js..."
          cd "${PROJECT_DIR}"
          pm2 startOrReload ecosystem.config.js --update-env

          echo "==> Saving PM2 process list..."
          pm2 save

          #################################################
          # CLEANUP
          #################################################
          rm -rf /tmp/theme-editor-dist

          echo "=========================================="
          echo "Deployment to ui-theme.pydah.edu.in completed successfully"
          echo "=========================================="

          ENDSSH

      #################################################
      # 7. Cleanup SSH key on GitHub Actions runner
      #################################################
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
