# ============================================================
# Nginx Configuration for ui-theme.pydah.edu.in
# Port 80 base configuration (Certificates can be installed manually via Certbot)
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name ui-theme.pydah.edu.in;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Root directory for static theme distribution files
    root /var/www/themes/frontend;

    # ============================================================
    # 1. Distributable Themes Directory (/themes/*)
    # Using ^~ ensures Nginx stops searching regex locations and serves directly
    # ============================================================
    location ^~ /themes/ {
        alias /var/www/themes/public/themes/;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Cache-Control "no-cache, must-revalidate" always;

        location ~* \.css$ {
            default_type text/css;
            if ($arg_v) {
                add_header Cache-Control "public, max-age=31536000, immutable" always;
            }
            if ($arg_v = "") {
                add_header Cache-Control "no-cache, must-revalidate" always;
            }
        }

        location ~* \.json$ {
            default_type application/json;
            add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        }

        location ~* \.js$ {
            default_type application/javascript;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }
    }

    # Direct root fallbacks for legacy/alternative paths: /theme.css, /theme-loader.js, /version.json
    location = /theme.css {
        alias /var/www/themes/public/themes/theme.css;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        default_type text/css;
    }

    location = /theme-loader.js {
        alias /var/www/themes/public/theme-loader.js;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        default_type application/javascript;
    }

    location = /version.json {
        alias /var/www/themes/public/version.json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        default_type application/json;
    }

    # ============================================================
    # 4. Backend API Reverse Proxy (Node.js running on port 4000)
    # ============================================================
    location /api/ {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ============================================================
    # 5. Theme Editor SPA Frontend (React + Vite dashboard)
    # ============================================================
    location / {
        root /var/www/themes/frontend;
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }
}
